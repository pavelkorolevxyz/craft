<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Очередь ревью</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dashboard.css">
  <script>
    try {
      const requestedTheme = new URLSearchParams(location.search).get("theme");
      const savedTheme = localStorage.getItem("review-theme");
      const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = requestedTheme || savedTheme || systemTheme;
      document.documentElement.dataset.themeSource = requestedTheme ? "query" : savedTheme ? "saved" : "system";
    } catch (error) {
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.themeSource = "system";
    }
  </script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="icon-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M8 10h4a6 6 0 0 0 6-6"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11"/><path d="M16 8V5H5v11h3"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></symbol>
  </svg>

  <main class="shell">
    <header class="workspace-head">
      <div class="workspace-head__top">
        <div class="workspace-title">
          <p class="eyebrow">northstar/web-app · main · демо-данные 18:45</p>
          <h1>Очередь ревью</h1>
        </div>
        <div class="workspace-tools" aria-label="Поиск и сортировка">
          <label class="search" for="search">
            <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
            <span class="visually-hidden">Поиск по merge request</span>
            <input id="search" type="search" placeholder="Номер, название или автор" autocomplete="off" aria-keyshortcuts="/">
            <kbd>/</kbd>
          </label>
          <label class="select-field" for="sort">
            <span class="visually-hidden">Сортировка</span>
            <select id="sort" aria-label="Сортировка очереди">
              <option value="updated">Недавно обновлённые</option>
              <option value="oldest">Самые старые</option>
              <option value="comments">Больше обсуждений</option>
            </select>
          </label>
          <button class="button button--icon" id="theme" type="button" aria-pressed="false" aria-label="Переключить тему" title="Переключить тему">
            <svg class="icon" aria-hidden="true"><use href="#icon-theme"/></svg>
          </button>
        </div>
      </div>
      <div class="queue-toolbar" aria-label="Режим очереди">
        <div class="segmented" role="radiogroup" aria-label="Фильтр по состоянию">
          <label><input type="radio" name="filter" value="all" checked><span>Все <b id="count-all">0</b></span></label>
          <label><input type="radio" name="filter" value="blocked"><span>Блокеры <b id="count-blocked">0</b></span></label>
          <label><input type="radio" name="filter" value="review"><span>На ревью <b id="count-review">0</b></span></label>
          <label><input type="radio" name="filter" value="ready"><span>Готовы <b id="count-ready">0</b></span></label>
          <label><input type="radio" name="filter" value="draft"><span>Черновики <b id="count-draft">0</b></span></label>
        </div>
        <p><kbd>J</kbd> <kbd>K</kbd> выбор · <kbd>/</kbd> поиск</p>
      </div>
    </header>

    <div class="review-workspace">
      <section class="queue" aria-labelledby="queue-title">
        <header class="panel-head">
          <div>
            <h2 id="queue-title">Merge requests</h2>
            <p id="result-count">0 результатов</p>
          </div>
          <span class="column-labels" aria-hidden="true"><span>Статус ревью</span><span class="build-label">Сборка</span></span>
        </header>
        <div class="queue-list" id="queue-list" role="listbox" aria-label="Открытые merge requests"></div>
        <div class="empty-state" id="empty-state" hidden>
          <strong>Ничего не найдено</strong>
          <p>Измените фильтр или поисковый запрос.</p>
          <button class="button" id="reset-filters" type="button">Сбросить фильтры</button>
        </div>
      </section>

      <aside class="review-detail" id="review-detail" aria-labelledby="detail-title">
        <header class="detail-head">
          <div>
            <p class="detail-kicker" id="detail-kicker">Merge request</p>
            <h2 id="detail-title">Выберите MR</h2>
          </div>
          <div class="detail-head__side">
            <span id="detail-status"></span>
            <button class="button button--compact" id="next-mr" type="button" aria-keyshortcuts="J">Следующий MR</button>
          </div>
        </header>
        <div id="detail-content"></div>
      </aside>
    </div>

  </main>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <script src="data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
