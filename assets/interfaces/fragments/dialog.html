<dialog class="dialog" id="{{DIALOG_ID}}" aria-labelledby="{{DIALOG_ID}}-title">
  <header class="dialog__head">
    <h2 id="{{DIALOG_ID}}-title">{{DIALOG_TITLE}}</h2>
    <button class="button button--icon" type="button" data-dialog-close aria-label="{{DIALOG_CLOSE_LABEL}}">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <div class="dialog__body">{{DIALOG_CONTENT}}</div>
  <footer class="dialog__foot">{{DIALOG_ACTIONS}}</footer>
</dialog>
