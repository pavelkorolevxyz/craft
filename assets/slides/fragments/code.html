<section class="slide" data-slide-layout="code">
  <div class="pad">
    <p class="slide-title">{{SLIDE_TITLE}}</p>
    <pre class="code" data-language="{{CODE_LANGUAGE}}" data-highlight-lines="{{HIGHLIGHT_LINES}}"><code>{{CODE}}</code></pre>
    <p class="type-note">{{FINDING}}</p>
  </div>
  <p class="slide-number"></p>
</section>
