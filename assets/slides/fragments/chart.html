<section class="slide s-chart" data-slide-layout="chart">
  <div class="pad">
    <p class="slide-title">{{SLIDE_TITLE}}</p>
    <div class="chart-layout content-aside content-aside--separated place-fill">
      <div class="bar-chart" role="img" aria-label="{{CHART_SUMMARY}}">{{CHART_ROWS}}</div>
      <div class="content-block"><h3 class="type-heading">{{FINDING}}</h3><p class="type-note">{{SOURCE}}</p></div>
    </div>
  </div>
  <p class="slide-number"></p>
</section>
