<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="../../shared/favicon-slides.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="deck">
<div class="slides">
  <section class="slide s-title-card" data-slide-layout="title">
    <div class="pad"><h1 class="type-hero">{{TITLE}}</h1></div>
    <p class="slide-number"></p>
  </section>
</div>
</div>

<div class="help-panel" role="toolbar" aria-label="Управление презентацией" aria-hidden="true" hidden>
  <div class="help-actions">
    <button type="button" data-deck-action="grid" aria-label="Обзор слайдов"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><span class="shortcut-key" aria-hidden="true">G</span></button>
    <button class="help-strip" type="button" data-deck-action="strip" aria-label="Обзор лентой"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="4"/><rect x="4" y="10" width="16" height="4"/><rect x="4" y="16" width="16" height="4"/></svg><span class="shortcut-key" aria-hidden="true">L</span></button>
    <button type="button" data-deck-action="fullscreen" aria-label="Полный экран"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg><span class="shortcut-key" aria-hidden="true">F</span></button>
    <button class="help-theme" type="button" data-deck-action="theme" aria-label="Включить светлую тему" aria-pressed="false"><svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8 8 0 0 1 8.8 4 8 8 0 1 0 20 15.2Z"/></svg><span class="shortcut-key" aria-hidden="true">T</span></button>
  </div>
  <div class="help-nav" aria-label="Навигация по слайдам">
    <button type="button" data-deck-go="-1" aria-label="Предыдущий слайд"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg></button>
    <label class="help-page"><input class="help-page-input" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Перейти к странице"><span class="help-page-total" aria-hidden="true"></span></label>
    <button type="button" data-deck-go="1" aria-label="Следующий слайд"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
  </div>
  <button class="help-close" type="button" data-deck-action="hide-help" aria-label="Скрыть управление"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span class="shortcut-key" aria-hidden="true">H</span></button>
</div>
<div class="help-reveal-zone"><button class="help-reveal" type="button" aria-label="Показать управление"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5M5 19h14"/></svg><span class="shortcut-key" aria-hidden="true">H</span></button></div>

<script src="../vendor/highlight.min.js"></script>
<script src="../code-highlight.js"></script>
<script src="../deck.js"></script>
</body>
</html>
